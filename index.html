<style>
/* Layout: Kopfzeile oben, eine Ansicht pro Bildschirm, feste Tab-Leiste unten mit großen Touch-Flächen. */
:root {
  --bg: #F2F4F8;
  --surface: #FFFFFF;
  --ink: #141B2E;
  --muted: #5A6580;
  --line: #DCE1EC;
  --accent: #3347D1;
  --accent-ink: #FFFFFF;
  --accent-soft: #E4E8FB;
  --good: #1E7A45;
  --good-soft: #DDF3E6;
  --bad: #B72E2E;
  --bad-soft: #FBE3E3;
  --font-display: "Space Grotesk", "Inter", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1424; --surface: #181F35; --ink: #E8ECF8; --muted: #9AA5C4; --line: #2A3350;
    --accent: #8E9CFF; --accent-ink: #0F1424; --accent-soft: #232C55;
    --good: #5CD08B; --good-soft: #153A28; --bad: #FF8A8A; --bad-soft: #4A2025;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1424; --surface: #181F35; --ink: #E8ECF8; --muted: #9AA5C4; --line: #2A3350;
  --accent: #8E9CFF; --accent-ink: #0F1424; --accent-soft: #232C55;
  --good: #5CD08B; --good-soft: #153A28; --bad: #FF8A8A; --bad-soft: #4A2025;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.55;
  padding-block: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--bg);
}
.wrap { max-width: 560px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.2; margin: 0; text-wrap: balance; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, textarea:focus-visible, input:focus-visible, summary:focus-visible {
  outline: 3px solid var(--accent); outline-offset: 2px;
}

/* Kopfzeile */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); padding-block: 12px 10px;
}
.top .wrap { display: flex; align-items: center; gap: 10px; }
.brand { flex: 1; min-width: 0; }
.brand small { display: block; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.brand h1 { font-size: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.btn {
  min-height: 52px; padding: 0 20px; border-radius: 14px; border: 1.5px solid var(--line);
  background: var(--surface); font-weight: 600; font-size: 16px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.good { background: var(--good-soft); border-color: var(--good); color: var(--good); }
.btn.bad { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.btn.block { width: 100%; }
.btn.small { min-height: 44px; padding: 0 14px; font-size: 15px; }
.btn[disabled] { opacity: .5; cursor: default; }

main { padding-block: 8px calc(110px + env(safe-area-inset-bottom, 0px)); }
.stack { display: flex; flex-direction: column; gap: 16px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 20px; }
.label { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-bottom: 10px; }
.lead { font-size: 18px; line-height: 1.55; margin: 0; }
.points { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }
.points li { display: grid; grid-template-columns: 10px 1fr; gap: 12px; align-items: start; }
.points li::before { content: ""; width: 10px; height: 10px; border-radius: 3px; background: var(--accent); margin-top: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 6px 14px; font-weight: 600; font-size: 14px; font-variant-numeric: tabular-nums; }
.chipbtn { border: 0; cursor: pointer; min-height: 40px; font-family: inherit; text-align: left; }
details summary { cursor: pointer; font-weight: 600; min-height: 44px; display: flex; align-items: center; }
details p { white-space: pre-line; margin: 8px 0 0; color: var(--muted); font-size: 15px; overflow-wrap: anywhere; }

/* Fortschritt */
.progress { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s; }
.meta { display: flex; justify-content: space-between; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }

/* Lernset-Leiste und Liste */
.deckbar { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 8px 8px 8px 16px; }
.deckbar .nm { flex: 1; min-width: 0; }
.deckbar small { display: block; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.deckbar strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.deckrow { display: flex; flex-direction: column; gap: 10px; border: 1.5px solid var(--line); border-radius: 16px; padding: 14px; background: var(--surface); }
.deckrow.active { border-color: var(--accent); }
.deckrow h3 { font-size: 18px; overflow-wrap: anywhere; }

/* Lernkarten */
.flip { perspective: 1200px; }
.card {
  position: relative; width: 100%; height: clamp(300px, 46vh, 420px); border: 0; padding: 0; background: none;
  transform-style: preserve-3d; transition: transform .5s; text-align: left;
}
.card.is-flipped { transform: rotateY(180deg); }
.card { touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.flip { transition: transform .25s ease, box-shadow .2s; border-radius: 20px; }
.flip.swipe-r { box-shadow: 0 0 0 4px var(--good, #2e9d5b); }
.flip.swipe-l { box-shadow: 0 0 0 4px var(--bad, #d64545); }
.face {
  position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  display: flex; flex-direction: column; justify-content: center; gap: 12px;
  padding: 24px; border-radius: 22px; border: 1.5px solid var(--line); background: var(--surface);
  overflow: auto; font-size: 20px; line-height: 1.45; white-space: pre-line;
}
.face .hint { font-size: 13px; color: var(--muted); letter-spacing: .04em; margin-top: auto; padding-top: 12px; }
.face.back { transform: rotateY(180deg); background: var(--accent-soft); border-color: var(--accent); }
.face.back .answer { font-family: var(--font-display); font-weight: 700; font-size: 26px; color: var(--accent); }
.face.back .full { font-size: 16px; color: var(--ink); }
.face.back .answer.long { font-family: var(--font-body); font-weight: 500; font-size: 19px; line-height: 1.5; color: var(--ink); }
.kind { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; color: var(--muted); }
.face.back .kind { color: var(--accent); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.two .btn { min-height: 60px; }

/* Quiz */
.q { font-family: var(--font-display); font-size: 22px; font-weight: 500; line-height: 1.35; white-space: pre-line; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt {
  min-height: 60px; padding: 14px 18px; border-radius: 16px; border: 1.5px solid var(--line);
  background: var(--surface); text-align: left; font-weight: 500; font-size: 17px; line-height: 1.35;
}
.opt.good { background: var(--good-soft); border-color: var(--good); color: var(--good); font-weight: 600; }
.opt.bad { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); font-weight: 600; }
.opt.dim { opacity: .55; }
.feedback { font-weight: 600; margin: 0; }
.feedback.good { color: var(--good); }
.feedback.bad { color: var(--bad); }
.score { font-family: var(--font-display); font-size: 64px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }

/* Eingaben */
textarea, input[type="text"], input[type="number"] {
  width: 100%; font: inherit; font-size: 16px; color: var(--ink); background: var(--bg);
  border: 1.5px solid var(--line); border-radius: 14px; padding: 14px;
}
textarea { min-height: 220px; resize: vertical; }
input[type="text"], input[type="number"] { min-height: 52px; }
.msg { margin: 0; font-size: 15px; color: var(--muted); overflow-wrap: anywhere; }
.msg.err { color: var(--bad); font-weight: 600; }
.setrow { display: flex; flex-direction: column; gap: 12px; }
.setrow.active { border-color: var(--accent); }
.setrow h3 { font-size: 18px; overflow-wrap: anywhere; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row .btn { flex: 1; }
.empty { text-align: center; padding: 40px 16px; display: flex; flex-direction: column; gap: 16px; align-items: center; }
.upl { position: relative; overflow: hidden; cursor: pointer; }
.upl input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; font-size: 0; }
.upl:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }

/* Chat */
.chat { display: flex; flex-direction: column; gap: 10px; }
.bubble { max-width: 88%; padding: 12px 16px; border-radius: 18px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 16px; line-height: 1.5; }
.bubble.me { align-self: flex-end; background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 6px; }
.bubble.ai { align-self: flex-start; background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 6px; }
.composer { position: sticky; bottom: calc(88px + env(safe-area-inset-bottom, 0px)); background: var(--bg); padding-block: 10px 4px; display: flex; flex-direction: column; gap: 10px; }

/* Tab-Leiste */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line);
  padding: 10px max(16px, env(safe-area-inset-left, 0px)) calc(10px + env(safe-area-inset-bottom, 0px));
}
.tabs .wrap { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; }
.tab {
  min-height: 56px; border: 0; border-radius: 14px; background: none; font-weight: 600; font-size: 13px; color: var(--muted);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
}
.tab svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tab[aria-current="true"] { background: var(--accent-soft); color: var(--accent); }
@media (prefers-reduced-motion: reduce) { .card, .progress > i { transition: none; } }
</style>

  /* ---------- Beispiel-Thema ---------- */
  function sampleTopic() {

      const qa = (pool, q, a) => { it.type = 'qa'; it.pool = pool; it.q = q; it.a = a; };

      else if ((m = /^(.+?),\s*(?:damit\s+(.+)|um\s+(.+\szu\s\S+))$/i.exec(body)) && m[1].split(' ').length <= 14) qa('purpose', whyQuestion(m[1], 'Wozu'), m[2] ? 'Damit ' + m[2] : 'Um ' + m[3]);
      else {
        m = DEF.exec(body);
        if (m && !okSubj(m[1])) m = null;
        const sup = m ? SUPER.exec(m[3]) : null;
        if (m && sup && !SUPER_SKIP.test(sup[1])) { it.type = 'ident'; it.subject = m[1]; }
        else if (m) { it.type = 'def'; it.subject = m[1]; it.verb = m[2]; it.pred = m[3]; }
        else if ((q2 = /^([A-ZÄÖÜ][^,]{2,50}?)\s+(besteht|bestehen)\s+(aus\s+.+)$/.exec(body)) && okSubj(q2[1])) qa('comp', 'Woraus ' + q2[2] + ' ' + lc1(q2[1]) + '?', uc1(q2[3]));
        else if ((q2 = /^((?:Zwischen|Hinter|Neben|Vor|Über|Unter|Auf|In|Im|Am|An)\s+[^,]{3,50}?)\s+(liegt|liegen|befindet sich|befinden sich)\s+(.+)$/.exec(body))) qa('where', 'Was ' + q2[2] + ' ' + q2[1].charAt(0).toLowerCase() + q2[1].slice(1) + '?', uc1(q2[3]));
        else if ((q2 = /^([A-ZÄÖÜ][^,]{2,50}?)\s+(liegt|liegen|befindet sich|befinden sich)\s+((?:zwischen|hinter|neben|vor|über|unter|auf|in|im|am|an|bei|nahe)\s+.+)$/.exec(body)) && okSubj(q2[1])) qa('where', 'Wo ' + q2[2] + ' ' + lc1(q2[1]) + '?', uc1(q2[3]));
        else if ((q2 = /^([A-ZÄÖÜ][^,]{2,50}?)\s+(dient|dienen)\s+(.+)$/.exec(body)) && okSubj(q2[1])) qa('serve', 'Wozu ' + q2[2] + ' ' + lc1(q2[1]) + '?', uc1(q2[3]));
        else {
          const years = body.match(/\b(1\d{3}|20\d{2})\b/);
          const nums = (body.match(NUM_RE) || []).filter(n => !isYear(n));
          if (years) { it.type = 'year'; it.value = years[1]; }
          else if (nums.length) { it.type = 'num'; it.value = nums[0]; }
        }
      }
      if ((it.type === 'cloze') && !it.cloze) it.type = 'none';
      it.rank = (PRIO[it.type] || 0) * 10 + 10 * scored[idx].sc / maxSc - (ANAPH.test(s) ? 25 : 0);
      return it;
    }).filter(it => it.type !== 'none');

    // Auswahlpools für falsche Antworten
    const subjects = [], reasons = [], preds = [], words = [], nums = [], qaPool = {}, clauses = [];
    sents.forEach(x => {
      const t = x.replace(/[.!?]+$/, '').split(/,\s*/).pop().trim(), n = t.split(' ').length;
      if (n >= 4 && n <= 12 && /^[a-zäöüß]/.test(t) && !/^(weil|denn|da|damit|dass|wobei|wodurch|bei|also|um|zu|und|oder|aber|sodass)\b/i.test(t)) clauses.push(t);
    });
    items.forEach(it => {
      if (it.type === 'qa') (qaPool[it.pool] = qaPool[it.pool] || []).push(it.a);
      if (it.subject && subjects.indexOf(it.subject) < 0) subjects.push(it.subject);
      if (it.reason) reasons.push(it.reason);
      if (it.pred) { const p = it.pred.trim(); if (p.length <= 110 && p.split(' ').length >= 3) { it.predShort = p; preds.push(p); } }
      [it.cloze, it.cloze2].forEach(c => {
        if (!c || UNIT.test(c.w)) return;
        const pool = c.num ? nums : words;
        if (pool.indexOf(c.w) < 0) pool.push(c.w);
      });
    });

    const cardOf = it => {
      const s = it.s;
      if (it.type === 'cause') return { kind: 'frage', q: it.q, a: 'Weil ' + it.reason + '.', full: s };
      if (it.type === 'qa') return { kind: 'frage', q: it.q, a: it.a + '.', full: s };
      if (it.type === 'ident') return { kind: 'frage', q: 'Wer oder was ist gemeint?\n' + blankOut(s, it.subject), a: it.subject, full: s };
      if (it.type === 'def') return { kind: 'frage', q: 'Was ' + it.verb + ' ' + lc1(it.subject) + '?', a: s, full: '' };
      if (it.type === 'year') return { kind: 'luecke', q: 'Welche Jahreszahl fehlt?\n' + blankOut(s, it.value), a: it.value, full: s };
      if (it.type === 'num') return { kind: 'luecke', q: 'Welche Zahl fehlt?\n' + blankOut(s, it.value), a: it.value, full: s };
      return { kind: 'luecke', q: 'Ergänze die Lücke:\n' + blankOut(s, it.cloze.w), a: it.cloze.w, full: s };
    };
    const pickOthers = (pool, own, n, ctx) => {
      const seen = {}; seen[own.toLowerCase()] = 1;
      const cap = x => /^[A-ZÄÖÜ]/.test(x), suf = x => x.slice(-2).toLowerCase();
      const fresh = pool.filter(x => { const k = x.toLowerCase(); if (seen[k]) return false; seen[k] = 1; return !(ctx && ctx.indexOf(x) >= 0); });
      const score = x => Math.abs(x.length - own.length) + (cap(x) === cap(own) ? 0 : 6) + (suf(x) === suf(own) ? -2 : 0) + Math.random() * 3;
      const out = fresh.map(x => ({ x: x, k: score(x) })).sort((a, b) => a.k - b.k).slice(0, n).map(o => o.x);
      return out.length === n ? out : null;
    };
    const clozeQuiz = (it, c) => {
      c = c || it.cloze;
      if (!c) return null;
      const d = pickOthers(c.num ? nums : words, c.w, 3, it.s); if (!d) return null;
      const opts = shuffle(d.concat([c.w]));
      return { q: (c.num ? 'Welche Zahl passt in die Lücke?\n' : 'Welcher Begriff passt in die Lücke?\n') + blankOut(it.s, c.w), options: opts, answer: opts.indexOf(c.w), why: it.s };
    };
    const quizOf = it => {
      let q = null, right = null, d = null;
      if (it.type === 'cause') { right = 'Weil ' + it.reason; d = pickOthers(reasons.concat(clauses), it.reason, 3, it.s); if (d) { d = d.map(x => 'Weil ' + x); q = it.q; } }
      else if (it.type === 'qa') { right = it.a; d = pickOthers(qaPool[it.pool], it.a, 3); q = it.q; }
      else if (it.type === 'ident') { right = it.subject; d = pickOthers(subjects, it.subject, 3); q = 'Wer oder was ist gemeint?\n' + blankOut(it.s, it.subject); }
      else if (it.type === 'def' && it.predShort) { right = uc1(it.predShort); d = pickOthers(preds, it.predShort, 3, it.s); if (d) d = d.map(uc1); q = 'Was trifft auf ' + lc1(it.subject) + ' zu?'; }
      else if (it.type === 'year') { right = it.value; d = yearDistractors(it.value); q = 'Welche Jahreszahl fehlt?\n' + blankOut(it.s, it.value); }
      else if (it.type === 'num') { right = it.value; d = numberDistractors(it.value, it.s); q = 'Welche Zahl fehlt?\n' + blankOut(it.s, it.value); }
      if (q && d && d.length === 3) {
        const opts = shuffle(d.concat([right]));
        return { q: q, options: opts, answer: opts.indexOf(right), why: it.s };
      }
      return clozeQuiz(it);
    };

    // Auswahl mit Vielfalt: pro Fragetyp sinkt die Punktzahl, damit nicht alles Lückentexte werden
    const pickDiverse = n => {
      const used = {}, out = [], pool = items.slice();
      while (out.length < n && pool.length) {
        let bi = 0, bs = -1e9;
        pool.forEach((it, i) => { const sc = it.rank - (used[it.type] || 0) * 7; if (sc > bs) { bs = sc; bi = i; } });
        const it = pool.splice(bi, 1)[0]; used[it.type] = (used[it.type] || 0) + 1; out.push(it);
      }
      return out;
    };
    const order = pickDiverse(items.length);
    const altOf = it => {
      if (it.type === 'cloze') return it.cloze2;
      if (it.type === 'num' || it.type === 'year') return [it.cloze, it.cloze2].filter(Boolean).find(c => c.w !== it.value) || null;
      return it.cloze;
    };
    const revDef = it => it.type === 'def' && okSubj(it.subject) && it.pred.split(' ').length >= 4 && it.pred.toLowerCase().indexOf(it.subject.toLowerCase().replace(/^(der|die|das|ein|eine)\s+/, '')) < 0;
    const revQ = it => 'Welcher Begriff wird so beschrieben?\n„' + uc1(it.pred) + '“';
    const picked = order.slice(0, nC).map(it => ({ key: it.idx * 2, card: cardOf(it) }));
    for (let i = 0; i < order.length && picked.length < nC; i++) {
      const it = order[i], alt = altOf(it);
      if (revDef(it)) picked.push({ key: it.idx * 2 + 1, card: { kind: 'frage', q: revQ(it), a: lc1(it.subject) === it.subject ? it.subject : it.subject, full: it.s } });
      else if (alt) picked.push({ key: it.idx * 2 + 1, card: { kind: 'luecke', q: 'Ergänze die Lücke:\n' + blankOut(it.s, alt.w), a: alt.w, full: it.s } });
    }
    let cards = picked.sort((a, b) => a.key - b.key).map(x => x.card);
    const quizItems = [], seenQ = {};
    const addQuiz = (idx, qq) => { if (qq && !seenQ[qq.q]) { seenQ[qq.q] = 1; quizItems.push({ idx: idx, q: qq }); } };
    for (let i = 0; i < order.length && quizItems.length < nQ; i++) addQuiz(order[i].idx, quizOf(order[i]));
    for (let i = 0; i < order.length && quizItems.length < nQ; i++) {
      const it = order[i];
      if (revDef(it)) { const d = pickOthers(subjects, it.subject, 3); if (d) { const opts = shuffle(d.concat([it.subject])); addQuiz(it.idx + 0.5, { q: revQ(it), options: opts, answer: opts.indexOf(it.subject), why: it.s }); continue; } }
      const alt = altOf(it); if (alt) addQuiz(it.idx + 0.5, clozeQuiz(it, alt));
    }
    const quiz = quizItems.sort((a, b) => a.idx - b.idx).map(x => x.q);
    const dedupe = (arr, f) => { const seen = {}; return arr.filter(x => { const k = normKey(f(x)); if (!k || seen[k]) return false; seen[k] = 1; return true; }); };
    cards = dedupe(cards, c => c.q);
    if (!cards.length) return { error: 'Aus diesem Text konnte ich keine Lernkarten ableiten. Versuche einen längeren Fließtext.' };

    const top = scored.slice().sort((a, b) => b.sc - a.sc).slice(0, Math.min(7, sents.length)).sort((a, b) => a.i - b.i);
    const best = top.find(x => x.i !== 0);
    const short = sents[0] + (best ? ' ' + best.s : '');
    return { title: titleOf(text, sents), summary: { short: short, points: top.map(x => x.s) }, cards: cards, quiz: quiz };
  }

  /* ---------- Erstellung mit Claude ---------- */
  const SPEC_CARDS = 'Regeln für die Karten: Vorne steht eine Frage, eine Information oder ein Ereignis, hinten die Antwort, die Erklärung oder das, was darauf folgt. Etwa drei Viertel der Karten sind klassische Frage-und-Antwort-Karten ("frage"): vorne eine klare, konkrete Frage, hinten die Antwort. Nur das restliche Viertel nutzt die anderen Arten. Arten für "kind":"frage" (Frage vorne, Antwort in 1 bis 3 Sätzen hinten), "ereignis" (Ereignis vorne; hinten steht entweder das Ereignis davor oder das Ereignis danach. Gib dafür zusätzlich "dir":"davor" oder "dir":"danach" an und nutze beide Richtungen: "davor" fragt nach Vorgeschichte oder Auslöser, "danach" nach der Folge), "ursache" (Fakt oder Wirkung vorne, Grund oder Erklärung hinten), "info" (Information vorne, Bedeutung oder Zusammenhang hinten), "vergleich" (zwei Dinge vorne, Unterschied und Gemeinsamkeit hinten). Keine Lückentexte und keine Abfrage einzelner Wörter. Vorderseite höchstens 2 Sätze, Rückseite 1 bis 3 Sätze.\n\n';
  const SPEC_QUIZ = 'Regeln für die Fragen: Echte Verständnisfragen, die Zusammenhänge, Gründe, Folgen, Vergleiche oder Anwendungen prüfen, zum Beispiel "Warum ...", "Was passiert, wenn ...", "Welche Aussage stimmt ...". Keine reine Abfrage einzelner Begriffe. Genau 4 Antwortmöglichkeiten als vollständige Aussagen ähnlicher Länge. Die falschen Antworten müssen plausibel klingen und typische Verwechslungen oder Denkfehler zum Thema aufgreifen. Genau eine Antwort ist richtig, "answer" ist ihr Index (0 bis 3) und wechselt von Frage zu Frage. "why" erklärt in 1 bis 2 Sätzen, warum die Antwort stimmt.\n\n';
  const SPEC_COMMON = 'Nutze nur Inhalte aus dem Text und erfinde nichts dazu. Der Text kann aus mehreren Dokumenten bestehen, die mit [Dokument: Name] beginnen. Behandle sie als ein gemeinsames Thema und verbinde sie sinnvoll.\n\n';

  function promptFor(kind, text, wish, n, have) {
    const w = str(wish).slice(0, 600);
    const wishTxt = w ? 'WUNSCH DER LERNENDEN PERSON. Er hat Vorrang bei Schwierigkeit, Schwerpunkt und Stil. Das JSON-Format, die Regeln für die Antworten und die Beschränkung auf den Inhalt des Textes bleiben bestehen:\n' + w + '\n\n' : '';
    const haveTxt = have.length ? 'Diese Einträge gibt es schon. Wiederhole sie nicht und decke andere Teile des Textes ab:\n' + have.slice(-80).map(x => '- ' + x.q.replace(/\s+/g, ' ').slice(0, 120)).join('\n') + '\n\n' : '';
    const head = kind === 'cards'
      ? 'Du bist ein erfahrener Lehrer. Erstelle aus dem Lerntext Lernkarten in der Sprache des Textes. Antworte nur mit einem JSON-Objekt der Form {"cards":[{"kind":"frage","front":"...","back":"..."},{"kind":"ereignis","dir":"davor","front":"...","back":"..."}]}\n\nErstelle ' + n + ' neue Karten. Gibt der Text nicht genug Stoff her, erstelle weniger.\n\n' + SPEC_CARDS
      : 'Du bist ein erfahrener Lehrer. Erstelle aus dem Lerntext ein Quiz in der Sprache des Textes. Antworte nur mit einem JSON-Objekt der Form {"quiz":[{"q":"...","options":["...","...","...","..."],"answer":0,"why":"..."}]}\n\nErstelle ' + n + ' neue Fragen. Gibt der Text nicht genug Stoff her, erstelle weniger.\n\n' + SPEC_QUIZ;
    return head + SPEC_COMMON + wishTxt + haveTxt + 'TEXT:\n' + String(text).slice(0, 150000);
  }
  function normCards(d) {
    const arr = Array.isArray(d) ? d : (d && Array.isArray(d.cards) ? d.cards : []);
    const kinds = { frage: 1, ereignis: 1, ursache: 1, info: 1, vergleich: 1 };
    return arr.filter(c => c && str(c.front) && str(c.back)).map(c => ({ kind: kinds[c.kind] ? c.kind : 'frage', dir: c.dir === 'davor' ? 'davor' : 'danach', q: str(c.front), a: str(c.back), full: '' }));
  }
  function normQuiz(d) {
    const arr = Array.isArray(d) ? d : (d && Array.isArray(d.quiz) ? d.quiz : []);
    return arr.filter(q => {
      if (!q || !str(q.q) || !Array.isArray(q.options) || q.options.length !== 4) return false;
      const o = q.options.map(str);
      if (o.some(x => !x) || new Set(o).size !== 4) return false;
      return Number.isInteger(q.answer) && q.answer >= 0 && q.answer < 4;
    }).map(q => ({ q: str(q.q), options: q.options.map(str), answer: q.answer, why: str(q.why) }));
  }
  const normKey = s => String(s).toLowerCase().replace(/[^a-zäöüß0-9]+/g, ' ').trim();

  function progress(m) {
    ui.build.msg = m;
    const el = document.getElementById('build-msg'); if (el) el.textContent = m;
  }
  function startJob(msg) { ui.build = { busy: true, msg: msg, err: false, ctl: new AbortController(), stop: false }; }

  // Erzeugt Karten oder Fragen in Etappen. Wirft nie, liefert {items, err}.
  async function genItems(kind, text, wish, total, o) {
    const per = kind === 'cards' ? 20 : 10;
    const out = [], seen = new Set();
    let err = null, tries = 0, first = true;
    const maxTries = Math.ceil(total / per) + 2;
    try {
      if (o.gate) await o.gate;
      while (out.length < total && tries < maxTries && !ui.build.stop) {
        tries++;
        let batch;
        try {
          batch = await smp.json(promptFor(kind, text, wish, Math.min(per, total - out.length), out), { modelTier: 'default', cache: false, signal: ui.build.ctl.signal });
        } catch (e) {
          if (!(e && e.code === 'cancelled')) err = e;
          break;
        } finally {
          if (first) { first = false; if (o.onFirst) o.onFirst(); }
        }
        let added = 0;
        (kind === 'cards' ? normCards(batch) : normQuiz(batch)).forEach(it => {
          const k = normKey(it.q);
          if (!seen.has(k) && out.length < total) { seen.add(k); out.push(it); added++; }
        });
        if (o.onCount) o.onCount(out.length);
        if (!added) break;
      }
    } catch (e) { err = err || e; }
    if (first && o.onFirst) o.onFirst();
    return { items: out, err: err };
  }
  async function aiSummary(text, signal) {
    const d = await smp.json('Du bist ein erfahrener Lehrer. Fasse den Lerntext in der Sprache des Textes zusammen. Antworte nur mit einem JSON-Objekt der Form {"title":"Kurztitel mit höchstens 5 Wörtern","short":"Zusammenfassung in 2 bis 3 Sätzen","points":["5 bis 8 Kernaussagen als vollständige Sätze"]}. Der Text kann aus mehreren Dokumenten bestehen, die mit [Dokument: Name] beginnen. Fasse sie als ein gemeinsames Thema zusammen. Nutze nur Inhalte aus dem Text.\n\nTEXT:\n' + String(text).slice(0, 150000), { modelTier: 'default', cache: false, signal: signal });
    const points = (d && Array.isArray(d.points) ? d.points : []).map(str).filter(Boolean);
    if (!d || !points.length) throw { code: 'bad' };
    return { title: str(d.title), short: str(d.short) || points[0], points: points };
  }
  async function buildAI(text, form, needSummary) {
    const nC = clampN(form.nCards, MAX_CARDS, 14), nQ = clampN(form.nQuiz, MAX_QUIZ, 10);
    const st = { c: 0, q: 0 };
    const upd = () => progress('Claude arbeitet … Karten ' + st.c + ' von ' + nC + ', Fragen ' + st.q + ' von ' + nQ + '.');
    upd();
    let release; const gate = new Promise(r => { release = r; });
    const cardsP = genItems('cards', text, form.wish, nC, { onFirst: release, onCount: n => { st.c = n; upd(); } });
    const quizP = genItems('quiz', text, form.wish, nQ, { gate: gate, onCount: n => { st.q = n; upd(); } });
    const sumP = needSummary ? gate.then(() => aiSummary(text, ui.build.ctl.signal)).catch(() => null) : Promise.resolve(null);
    const r = await Promise.all([cardsP, quizP, sumP]);
    const cr = r[0], qr = r[1], sm = r[2];
    if (!cr.items.length || !qr.items.length) {
      if (ui.build.stop) throw { code: 'cancelled' };
      throw cr.err || qr.err || { code: 'bad' };
    }
    let summary = null, title = '';
    if (needSummary) {
      if (sm) { summary = { short: sm.short, points: sm.points }; title = sm.title; }
      else { const loc = localAnalyze(text, 3, 3); summary = loc.summary || { short: '', points: [] }; title = loc.title || ''; }
    }
    const err = cr.err || qr.err;
    let note = '';
    if (cr.items.length < nC || qr.items.length < nQ) {
      note = 'Erstellt: ' + plural(cr.items.length, 'Karte', 'Karten') + ' und ' + plural(qr.items.length, 'Frage', 'Fragen') + ' (gewünscht: ' + nC + ' und ' + nQ + '). ' +
        (ui.build.stop ? 'Du hast vorzeitig beendet.' : err ? errMsg(err) : 'Mehr Stoff gibt der Text nicht her.');
    }
    return { summary: summary, title: title, cards: cr.items, quiz: qr.items, note: note };
  }
  function errMsg(err) {
    const c = err && err.code;
    if (c === 'not_granted' || c === 'sampling_disabled') return 'Du hast Claude für diese App nicht erlaubt. Ohne Erlaubnis kann ich keine Fragen schreiben.';
    if (c === 'rate_limited') return 'Zu viele Anfragen oder dein Kontingent ist aufgebraucht. Versuche es später noch einmal.';
    if (c === 'prompt_too_large') return 'Der Text ist zu lang. Teile ihn in kleinere Themen auf.';
    if (c === 'invalid_json' || c === 'bad' || c === 'empty_completion') return 'Die Antwort war unvollständig. Versuche es noch einmal oder wähle weniger Karten und Fragen.';
    if (c === 'cancelled') return 'Abgebrochen. Es wurde noch nichts erstellt.';
    if (c === 'pdf') return 'Dieses PDF ließ sich nicht lesen (vielleicht nur gescannte Seiten). Lade die Seiten als Bilder hoch.';
    if (c === 'format') return 'Dieses Dateiformat kann ich nicht lesen. Möglich sind Text, PDF, Word (.docx), Excel (.xlsx), CSV und Bilder. Speichere ältere Tabellen als .xlsx oder .csv.';
    if (c === 'read') return 'Die Datei konnte nicht gelesen werden.';
    if (c === 'noai' || c === 'images_unavailable') return 'Bilder lesen braucht Claude. Erlaube Claude für diese App oder füge den Text ein.';
    if (c === 'image_rejected') return 'Dieses Bild wird nicht unterstützt. Erlaubt sind JPEG, PNG, WebP und GIF bis 20 MB.';
    return 'Das hat nicht geklappt. Prüfe deine Verbindung und versuche es noch einmal.';
  }

  /* ---------- Dateien lesen ---------- */
  const IMG_PROMPT = 'Lies den gesamten Text aus den angehängten Bildern ab (Buchseite, Folie, Notizen, Tafel oder Screenshot) und gib ihn als reinen Text wieder, in der Sprache der Vorlage und in der Reihenfolge der Bilder. Überschriften schreibst du mit # davor, Aufzählungen mit - davor. Zeigt ein Bild Diagramme oder Fotos ohne Text, beschreibe den Lerninhalt in vollständigen Sätzen. Antworte ohne Einleitung und ohne Kommentar, nur mit dem Inhalt.';
  // In Claude lädt die Seite pdf.js aus dem CDN. In der eigenständigen App liegt es lokal im Ordner pdfjs/.
  async function pdfLib() {
    if (window.pdfjsLib) {
      try { window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; } catch (x) {}
      return window.pdfjsLib;
    }
    const m = await import('./pdfjs/pdf.min.mjs');
    m.GlobalWorkerOptions.workerSrc = './pdfjs/pdf.worker.min.mjs';
    return m;
  }
  function readPdf(file) {
    return file.arrayBuffer().then(buf => pdfLib().then(lib => lib.getDocument({ data: new Uint8Array(buf) }).promise)).then(pdf => {
      const pages = []; let chain = Promise.resolve();
      for (let p = 1; p <= pdf.numPages; p++) {
        chain = chain.then(() => pdf.getPage(p)).then(pg => pg.getTextContent())
          .then(tc => { pages.push(tc.items.map(it => it.str).join(' ').replace(/\s+/g, ' ').trim()); });

  }
  function cardBack() {
    const set = active(); const d = set && deckOf(set);
    if (!d || !fc || !fc.hist || !fc.hist.length) return;
    const h = fc.hist.pop();

  /* Quiz */
  function quizTabHTML(set) {
    if (!set.decks.length) return noDeckHTML();
    if (set.decks.length > 1 && !ui.picked[set.id]) return pickerHTML(set);
    const d = deckOf(set);
    return '<div class="stack">' + flashHTML() + deckBarHTML(set, d) + quizHTML(d) + '</div>';
  }
  function startQuiz(d) {
    qz = { deckId: d.id, i: 0, score: 0, picked: null, finished: false,
      run: shuffle(d.quiz).map(q => ({ q: q.q, opts: shuffle(q.options), right: q.options[q.answer], why: q.why || '' })) };
  }
  function quizHTML(d) {
    if (!d.quiz.length) return '<div class="panel empty"><h2>Kein Quiz</h2><p class="msg">Dieses Lernset hat keine Quizfragen.</p></div>';
    if (!qz || qz.deckId !== d.id) startQuiz(d);
    const n = qz.run.length;
    if (qz.finished) {
      const pct = Math.round(qz.score / n * 100);
      const msg = pct === 100 ? 'Perfekt, alles richtig.' : pct >= 70 ? 'Gut gemacht.' : pct >= 40 ? 'Ein Anfang. Die Lernkarten helfen beim Festigen.' : 'Noch Luft nach oben. Probiere zuerst die Lernkarten.';
      return '<div class="panel stack" style="text-align:center;align-items:center"><div class="label" style="margin:0">Ergebnis</div><div class="score">' + qz.score + ' / ' + n + '</div><p class="lead">' + pct + ' % richtig. ' + msg + '</p>' +
        (d.best != null ? '<p class="msg">Bestes Ergebnis: ' + d.best + ' / ' + n + '</p>' : '') + '</div>' +
        '<button class="btn primary block" type="button" data-act="quiz-restart">Quiz neu starten</button>' +
        '<button class="btn block" type="button" data-act="tab" data-tab="cards">Zu den Lernkarten</button>';
    }
    const r = qz.run[qz.i], pct2 = Math.round(qz.i / n * 100), picked = qz.picked;
    const opts = r.opts.map((o, k) => {
      let cls = 'opt';
      if (picked !== null) { if (o === r.right) cls += ' good'; else if (k === picked) cls += ' bad'; else cls += ' dim'; }
      return '<button type="button" class="' + cls + '" data-act="pick" data-k="' + k + '"' + (picked !== null ? ' disabled' : '') + '>' + esc(o) + '</button>';
    }).join('');
    let fb = '';
    if (picked !== null) {
      const ok = r.opts[picked] === r.right;
      fb = '<p class="feedback ' + (ok ? 'good' : 'bad') + '">' + (ok ? 'Richtig!' : 'Leider falsch. Richtig ist: ' + esc(r.right)) + '</p>' + (r.why ? '<p class="msg">' + esc(r.why) + '</p>' : '') +
        '<button class="btn primary block" type="button" data-act="next">' + (qz.i + 1 < n ? 'Weiter' : 'Ergebnis zeigen') + '</button>';
    }
    return '<div class="meta"><span>Frage ' + (qz.i + 1) + ' von ' + n + '</span><span>' + qz.score + ' richtig</span></div><div class="progress"><i style="width:' + pct2 + '%"></i></div>' +
      '<div class="panel"><div class="q">' + esc(r.q) + '</div></div><div class="opts">' + opts + '</div>' + fb +
      (picked === null && n - qz.i > 1 ? '<button class="btn block" type="button" data-act="qskip">Überspringen</button><p class="msg" style="text-align:center">Übersprungene Fragen kommen am Ende noch einmal.</p>' : '');
  }

      '<div><div class="label">Fragen (1 bis ' + MAX_QUIZ + ')</div><input type="number" inputmode="numeric" id="f-quiz" min="1" max="' + MAX_QUIZ + '" value="' + esc(f.nQuiz) + '">' +

      '<div class="panel stack"><div><div class="label">Titel des Themas (optional)</div><input type="text" id="imp-title" value="' + esc(d.title) + '" placeholder="z. B. Biologie Kapitel 3"></div>' +
      '<div><div class="label">Text einfügen</div><textarea id="imp-text" placeholder="Hier Lerntext einfügen …">' + esc(d.text) + '</textarea></div>' +
      '<label class="btn block upl">Dateien wählen (' + (ui.img ? 'Text, PDF, Word, Excel, CSV, Bilder' : 'Text, PDF, Word, Excel, CSV') + ', mehrere möglich)<input type="file" id="imp-file" multiple></label>' +

  function newDeckHTML(set) {
    return '<div class="stack"><div class="panel stack"><h2 style="font-size:20px">Neues Lernset</h2>' +

      '<button class="btn primary block" type="button" data-act="create-deck"' + (ui.build.busy ? ' disabled' : '') + '>' + (ui.build.busy ? 'Wird erstellt …' : 'Lernset erstellen') + '</button>' +
      '<button class="btn block" type="button" data-act="back"' + (ui.build.busy ? ' disabled' : '') + '>Zurück</button></div>';

  /* Chat */
  const CHAT_SUGGEST = ['Fasse das Wichtigste in fünf Sätzen zusammen', 'Erkläre mir den schwierigsten Teil einfach', 'Stelle mir eine knifflige Frage zum Text'];
  function chatHTML(set) {
    if (!smp) return '<div class="panel empty"><h2>Chat nicht verfügbar</h2><p class="msg">Der Chat braucht Claude. Er funktioniert nur, wenn du Claude für diese App erlaubst.</p></div>';
    const msgs = set.chat || [], c = ui.chat;
    let list = msgs.map(m => '<div class="bubble ' + (m.role === 'user' ? 'me' : 'ai') + '">' + esc(m.content) + '</div>').join('');
    if (c.busy) list += '<div class="bubble ai" id="chat-live">' + esc(c.partial || 'Denkt nach …') + '</div>';
    const intro = (!msgs.length && !c.busy) ? '<div class="panel stack"><div class="label" style="margin:0">Frag zu „' + esc(set.title) + '“</div><p class="msg">Ich antworte nur auf Grundlage der Dokumente dieses Themas. Zum Beispiel:</p><div class="chips">' +
      CHAT_SUGGEST.map(q => '<button class="chip chipbtn" type="button" data-act="chat-ask" data-q="' + esc(q) + '">' + esc(q) + '</button>').join('') + '</div></div>' : '';
    return '<div class="stack">' + intro + '<div class="chat">' + list + '</div>' +
      (c.err ? '<p class="msg err">' + esc(c.err) + '</p>' : '') +
      '<div class="composer"><textarea id="chat-in" style="min-height:76px" placeholder="Frage zum Text stellen …"' + (c.busy ? ' disabled' : '') + '>' + esc(c.draft || '') + '</textarea>' +
      '<div class="row">' + (c.busy ? '<button class="btn block" type="button" data-act="chat-stop">Stopp</button>' :
        '<button class="btn primary" type="button" data-act="chat-send">Senden</button>' + (msgs.length ? '<button class="btn" type="button" data-act="chat-clear">Chat leeren</button>' : '')) + '</div></div></div>';
  }
  const toBottom = () => setTimeout(() => window.scrollTo(0, document.body.scrollHeight), 0);
  function sendChat(q) {
    const set = active(); q = String(q || '').trim();
    if (!set || !smp || ui.chat.busy || !q) return;
    set.chat = set.chat || [];
    set.chat.push({ role: 'user', content: q });
    ui.chat.err = ''; ui.chat.draft = ''; ui.chat.busy = true; ui.chat.partial = '';
    ui.chat.ctl = new AbortController();
    const sys = 'Du bist ein geduldiger Lernbegleiter. Beantworte Fragen ausschließlich auf Grundlage des folgenden Lerntexts. Der Text kann aus mehreren Dokumenten bestehen, die mit [Dokument: Name] beginnen. Nenne bei Bedarf, aus welchem Dokument etwas stammt. Steht die Antwort nicht im Text, sage das klar und gib höchstens einen kurzen allgemeinen Hinweis, den du als „nicht im Text“ kennzeichnest. Antworte in der Sprache der Frage, kurz und gut verständlich. Verwende kein Markdown (keine Sternchen, keine Überschriften), Aufzählungen mit „- “ sind erlaubt. Wenn die Person Übungsfragen möchte, stelle eine Frage nach der anderen und warte auf die Antwort.\n\nLERNTEXT:\n' + String(set.text || '').slice(0, 150000);
    const turns = [{ role: 'user', content: sys }].concat(set.chat.slice(0, -1).slice(-12), [{ role: 'user', content: q }]);
    render(); toBottom();
    const finish = () => {
      ui.chat.busy = false; ui.chat.partial = ''; ui.chat.ctl = null;
      if (set.chat.length > 40) set.chat = set.chat.slice(-40);
      save(); if (ui.view === 'study' && ui.tab === 'chat') { render(); toBottom(); }
    };
    smp(turns, { cache: false, signal: ui.chat.ctl.signal, onText: u => {
      ui.chat.partial = u.text; const el = document.getElementById('chat-live'); if (el) { el.textContent = u.text; window.scrollTo(0, document.body.scrollHeight); }
    } }).then(r => { set.chat.push({ role: 'assistant', content: r.text }); finish(); })
      .catch(err => {
        if (err && err.text) set.chat.push({ role: 'assistant', content: err.text });
        if (!(err && err.code === 'cancelled')) ui.chat.err = errMsg(err);
        finish();
      });
  }

  /* ---------- Aktionen ---------- */
  const goTop = () => window.scrollTo(0, 0);
  function setMsg(msg, err) {
    ui.draft.msg = msg; ui.draft.err = !!err;
    const m = document.getElementById('imp-msg'); if (m) { m.textContent = msg; m.className = 'msg' + (err ? ' err' : ''); }
  }
  function openTopic(id) {
    S.activeId = id; save(); fc = null; qz = null; ui.view = 'study'; ui.tab = 'summary';
    ui.flash = ''; ui.docMsg = ''; ui.docErr = false; ui.chat.err = ''; ui.chat.draft = ''; ui.delDeckId = null;
  }
  function readForm() {
    const f = ui.form;
    return { name: str(f.name), wish: str(f.wish), nCards: clampN(f.nCards, MAX_CARDS, 14), nQuiz: clampN(f.nQuiz, MAX_QUIZ, 10) };
  }
  function failJob(err) {
    ui.build = { busy: false, msg: errMsg(err), err: true, ctl: null, stop: false };
    render();
  }

  async function createTopic() {
    const text = ui.draft.text.trim();
    const form = readForm();
    const isVoc = !!parseVocab(text);
    if (text.length < 80 && !isVoc) { ui.build = { busy: false, msg: 'Der Text ist zu kurz. Füge mindestens ein paar Sätze oder ein Dokument hinzu.', err: true, ctl: null, stop: false }; render(); return; }
    let r;
    if (smp && !isVoc) {
      startJob('Claude liest deinen Text …'); render();
      try { r = await buildAI(text, form, true); } catch (e) { failJob(e); return; }
    } else {
      const loc = localAnalyze(text, form.nCards, form.nQuiz);
      if (loc.error) { ui.build = { busy: false, msg: loc.error, err: true, ctl: null, stop: false }; render(); return; }
      r = { summary: loc.summary, title: loc.title, cards: loc.cards, quiz: loc.quiz, blocks: loc.blocks || null, note: loc.note || '' };
    }
    const mkDeck = (name, cards, quiz) => ({ id: uid(), name: name, created: Date.now(), wish: form.wish, cards: cards, quiz: quiz, known: {}, best: null });
    const decks = (r.blocks && r.blocks.length > 1) ? r.blocks.map(b => mkDeck(b.name, b.cards, b.quiz)) : [mkDeck(form.name || 'Lernset 1', r.cards, r.quiz)];
    const topic = { id: uid(), v: 4, title: str(ui.draft.title) || r.title || 'Neues Thema', created: Date.now(), text: text, docs: ui.draft.docs.length ? ui.draft.docs.slice() : ['Eingefügter Text'], summary: r.summary, decks: decks, deckId: decks[0].id, chat: [] };
    S.sets.unshift(topic); S.activeId = topic.id; save();
    ui.draft = { title: '', text: '', docs: [], msg: '', err: false }; ui.form = newForm();
    ui.build = { busy: false, msg: '', err: false, ctl: null, stop: false };
    fc = null; qz = null; ui.picked = {}; openTopic(topic.id); ui.flash = r.note || ''; render(); goTop();
  }
  async function createDeck() {
    const set = active(); if (!set) return;
    const form = readForm();
    let r;
    if (smp && !parseVocab(set.text)) {
      startJob('Claude liest deine Dokumente …'); render();
      try { r = await buildAI(set.text, form, false); } catch (e) { failJob(e); return; }
    } else {
      const loc = localAnalyze(set.text, form.nCards, form.nQuiz);
      if (loc.error) { ui.build = { busy: false, msg: loc.error, err: true, ctl: null, stop: false }; render(); return; }
      r = { cards: loc.cards, quiz: loc.quiz, blocks: loc.blocks || null, note: loc.note || '' };
    }
    const mkDeck = (name, cards, quiz) => ({ id: uid(), name: name, created: Date.now(), wish: form.wish, cards: cards, quiz: quiz, known: {}, best: null });
    const fresh = (r.blocks && r.blocks.length > 1) ? r.blocks.map(b => mkDeck(b.name, b.cards, b.quiz)) : [mkDeck(form.name || ('Lernset ' + (set.decks.length + 1)), r.cards, r.quiz)];
    fresh.forEach(d => set.decks.push(d)); set.deckId = fresh[0].id; ui.picked[set.id] = true; save();
    ui.form = newForm(); ui.build = { busy: false, msg: '', err: false, ctl: null, stop: false };
    fc = null; qz = null; ui.view = 'study'; ui.tab = fresh.length > 1 ? 'summary' : 'cards'; ui.flash = r.note || ''; render(); goTop();
  }
  async function updateSummary(set) {
    ui.sumBusy = true; render();
    try {
      let sm;
      if (smp && !parseVocab(set.text)) { const r = await aiSummary(set.text); sm = { short: r.short, points: r.points }; }
      else { const loc = localAnalyze(set.text, 3, 3); if (loc.error) throw { code: 'bad' }; sm = loc.summary; }
      set.summary = sm; set.summaryStale = false; save(); ui.flash = '';
    } catch (e) { ui.flash = errMsg(e); }
    ui.sumBusy = false; if (ui.view === 'study' && ui.tab === 'summary') render();
  }
  function addDocsToTopic(set, docs) {
    if (!docs.length) return;
    set.docs = (set.docs && set.docs.length) ? set.docs : ['Ursprünglicher Text'];
    docs.forEach(d => { set.text = appendDoc(set.text, d); set.docs.push(d.name); });
    set.summaryStale = true; save();
  }

  document.addEventListener('change', e => {
    const f = e.target;
    if (!f || f.id !== 'bk-file' || !f.files || !f.files[0]) return;
    f.files[0].text().then(txt => {
      const m = importBackup(txt); ui.bkErr = !/eingelesen/.test(m); ui.bkMsg = m; render();
    }).catch(() => { ui.bkErr = true; ui.bkMsg = 'Die Datei konnte nicht gelesen werden.'; render(); });
  });

  let sw = null, swipeBlock = false;
  document.addEventListener('pointerdown', e => {
    const c = e.target.closest && e.target.closest('#card');
    if (!c || (e.pointerType === 'mouse' && e.button !== 0)) return;
    swipeBlock = false;
    sw = { x: e.clientX, y: e.clientY, dx: 0, on: false, el: c.parentNode };
  });
  document.addEventListener('pointermove', e => {
    if (!sw) return;
    const dx = e.clientX - sw.x, dy = e.clientY - sw.y;
    if (!sw.on && Math.abs(dx) < 12) { if (Math.abs(dy) > 14) sw = null; return; }
    if (!sw.on && Math.abs(dy) > Math.abs(dx)) { sw = null; return; }
    sw.on = true; sw.dx = dx;
    sw.el.style.transition = 'none';
    sw.el.style.transform = 'translateX(' + dx + 'px) rotate(' + (dx / 28) + 'deg)';
    sw.el.classList.toggle('swipe-r', dx > 60); sw.el.classList.toggle('swipe-l', dx < -60);
  });
  const endSwipe = () => {
    if (!sw) return; const s = sw; sw = null;
    if (!s.on) return;
    swipeBlock = true; setTimeout(() => { swipeBlock = false; }, 400);
    if (Math.abs(s.dx) > 100) cardAct(s.dx > 0 ? 'known' : 'again');
    else { s.el.style.transition = 'transform .2s ease'; s.el.style.transform = ''; s.el.classList.remove('swipe-r', 'swipe-l'); }
  };
  document.addEventListener('pointerup', endSwipe);
  document.addEventListener('pointercancel', endSwipe);

  document.addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    if (b.dataset.act === 'flip' && swipeBlock) { swipeBlock = false; return; }
    const act = b.dataset.act, set = active();
    switch (act) {
      case 'tab':
        if (!set) { ui.view = 'import'; render(); return; }
        ui.view = 'study'; ui.tab = b.dataset.tab; ui.flash = ''; render();
        window.scrollTo(0, ui.tab === 'chat' ? document.body.scrollHeight : 0); break;
      case 'go-sets': ui.view = 'sets'; ui.delId = null; ui.bkMsg = ''; render(); goTop(); break;
      case 'bk-save': {
        ui.bkErr = false;
        try {
          const a = document.createElement('a');
          a.href = URL.createObjectURL(new Blob([backupJSON()], { type: 'application/json' }));
          a.download = 'lernwerk-sicherung-' + new Date().toISOString().slice(0, 10) + '.json';
          document.body.appendChild(a); a.click(); a.remove();
          ui.bkMsg = 'Die Datei wird gespeichert. Falls nichts passiert, nimm „Text kopieren“.';
        } catch (x) { ui.bkErr = true; ui.bkMsg = 'Speichern als Datei klappt hier nicht. Nimm „Text kopieren“.'; }
        render(); break;
      }
      case 'bk-copy': {
        const txt = backupJSON();
        const done = ok => { ui.bkErr = !ok; ui.bkMsg = ok ? 'Sicherung kopiert. Füge sie irgendwo ein, zum Beispiel in eine Notiz.' : 'Kopieren wurde blockiert. Der Text steht jetzt unten im Feld, markiere und kopiere ihn von dort.'; render(); if (!ok) { const t = document.getElementById('bk-text'); if (t) { t.value = txt; t.select(); } } };
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(() => done(true), () => done(false)); else done(false);
        break;
      }
      case 'bk-paste': {
        const t = document.getElementById('bk-text');
        const m = importBackup(t ? t.value : '');
        ui.bkErr = !/eingelesen/.test(m); ui.bkMsg = m; render(); break;
      }
      case 'go-import': ui.view = 'import'; render(); goTop(); break;
      case 'back': ui.view = 'study'; ui.build.msg = ''; render(); goTop(); break;
      case 'open': openTopic(b.dataset.id); render(); goTop(); break;
      case 'del':
        if (ui.delId !== b.dataset.id) { ui.delId = b.dataset.id; render(); return; }
        S.sets = S.sets.filter(s => s.id !== ui.delId);
        if (S.activeId === ui.delId) S.activeId = S.sets.length ? S.sets[0].id : null;
        ui.delId = null; fc = null; qz = null; save(); render(); break;
      case 'go-newdeck':
        if (!set) return;
        ui.form = newForm(); if (!ui.build.busy) ui.build = { busy: false, msg: '', err: false, ctl: null, stop: false };
        ui.view = 'newdeck'; render(); goTop(); break;
      case 'deck-open':
        if (!set) return;
        set.deckId = b.dataset.id; ui.picked[set.id] = true; save(); fc = null; qz = null;
        ui.view = 'study'; ui.tab = b.dataset.to; ui.flash = ''; render(); goTop(); break;
      case 'deck-switch': if (set) { ui.picked[set.id] = false; render(); goTop(); } break;
      case 'deck-del':
        if (!set) return;
        if (ui.delDeckId !== b.dataset.id) { ui.delDeckId = b.dataset.id; render(); return; }
        set.decks = set.decks.filter(d => d.id !== ui.delDeckId);
        if (set.deckId === ui.delDeckId) set.deckId = set.decks.length ? set.decks[0].id : null;
        ui.delDeckId = null; fc = null; qz = null; save(); render(); break;
      case 'wish': {
        const wi = document.getElementById('f-wish'), cur = wi ? wi.value.trim() : String(ui.form.wish || '').trim();
        ui.form.wish = (cur ? cur.replace(/[.\s]+$/, '') + '. ' : '') + b.dataset.w + '.';
        if (wi) wi.value = ui.form.wish; break;
      }
      case 'setn': {
        const k = b.dataset.k; ui.form[k] = +b.dataset.v;
        const inp = document.getElementById(k === 'nCards' ? 'f-cards' : 'f-quiz'); if (inp) inp.value = ui.form[k]; break;
      }
      case 'create-topic': if (!ui.build.busy) createTopic(); break;
      case 'create-deck': if (!ui.build.busy) createDeck(); break;
      case 'job-stop': ui.build.stop = true; if (ui.build.ctl) ui.build.ctl.abort(); progress('Wird beendet …'); break;
      case 'sum-update': if (set && !ui.sumBusy) updateSummary(set); break;
      case 'add-paste': {
        const ta = document.getElementById('add-text'), t = ta ? ta.value.trim() : '';
        if (!set || !t) { ui.docMsg = 'Füge zuerst Text ein.'; ui.docErr = true; render(); return; }
        const n = (set.docs || []).filter(x => /^Eingefügter Text/.test(x)).length + 1;
        addDocsToTopic(set, [{ name: 'Eingefügter Text ' + n, text: t }]);
        ui.docMsg = 'Text hinzugefügt. Neue Lernsets nutzen ihn. Die Zusammenfassung kannst du oben aktualisieren.'; ui.docErr = false; render(); break;
      }
      case 'flip': { const c = document.getElementById('card'); if (c) c.classList.toggle('is-flipped'); break; }
      case 'known': cardAct('known'); break;
      case 'card-back': cardBack(); break;
      case 'again': cardAct('again'); break;
      case 'skip': if (fc && fc.queue.length > 1) cardAct('skip'); break;
      case 'qskip': if (qz && !qz.finished && qz.picked === null && qz.run.length - qz.i > 1) { qz.run.push(qz.run.splice(qz.i, 1)[0]); render(); } break;
      case 'cards-reset': { const d = set && deckOf(set); if (d) { d.known = {}; fc = null; save(); render(); } break; }
      case 'pick':
        if (qz && qz.picked === null) { const k = +b.dataset.k, r = qz.run[qz.i]; qz.picked = k; if (r.opts[k] === r.right) qz.score++; render(); }
        break;
      case 'next': {
        const d = set && deckOf(set);
        if (!qz) break;
        if (qz.i + 1 < qz.run.length) { qz.i++; qz.picked = null; }
        else { qz.finished = true; if (d && (d.best == null || qz.score > d.best)) { d.best = qz.score; save(); } }
        render(); goTop(); break;
      }
      case 'quiz-restart': { const d = set && deckOf(set); if (d) { startQuiz(d); render(); goTop(); } break; }
      case 'chat-send': { const ci = document.getElementById('chat-in'); sendChat(ci ? ci.value : ui.chat.draft); break; }
      case 'chat-ask': sendChat(b.dataset.q); break;
      case 'chat-stop': if (ui.chat.ctl) ui.chat.ctl.abort(); break;
      case 'chat-clear': if (set) { set.chat = []; ui.chat.err = ''; save(); render(); } break;
    }
  });

  document.addEventListener('input', e => {
    switch (e.target.id) {
      case 'imp-title': ui.draft.title = e.target.value; break;
      case 'imp-text': ui.draft.text = e.target.value; break;
      case 'f-name': ui.form.name = e.target.value; break;
      case 'f-wish': ui.form.wish = e.target.value; break;
      case 'f-cards': ui.form.nCards = e.target.value; break;
      case 'f-quiz': ui.form.nQuiz = e.target.value; break;
      case 'chat-in': ui.chat.draft = e.target.value; break;
    }
  });

  document.addEventListener('change', e => {
    const id = e.target.id;
    if (id !== 'imp-file' && id !== 'add-file') return;
    const files = Array.prototype.slice.call(e.target.files || []);
    e.target.value = '';
    if (!files.length) return;
    if (id === 'imp-file') {
      setMsg('Dateien werden gelesen …', false);
      loadFiles(files, m => setMsg(m, false)).then(res => {
        res.docs.forEach(d => { ui.draft.text = appendDoc(ui.draft.text, d); ui.draft.docs.push(d.name); });
        if (!ui.draft.title && res.docs.length) ui.draft.title = res.docs[0].name.replace(/\.[^.]+$/, '');
        ui.draft.msg = resultMsg(res) + (res.docs.length ? ' Du kannst den Text noch anpassen.' : '');
        ui.draft.err = !res.docs.length;
        if (ui.view === 'import') render();
      });
    } else {
      const set = active(); if (!set) return;
      const dm = document.getElementById('doc-msg'); if (dm) dm.textContent = 'Dateien werden gelesen …';
      loadFiles(files, m => { const el = document.getElementById('doc-msg'); if (el) el.textContent = m; }).then(res => {
        addDocsToTopic(set, res.docs);
        ui.docMsg = resultMsg(res) + (res.docs.length ? ' Neue Lernsets nutzen alle Dokumente. Die Zusammenfassung kannst du oben aktualisieren.' : '');
        ui.docErr = !res.docs.length;
        if (ui.view === 'study' && ui.tab === 'summary') render();
      });
    }
  });

  render();

  (async function () {
    try {
      if (!(window.claude && window.claude.use)) return;
      const s = await window.claude.use('sample');
      if (!s) return;
      const l = await s.limits().catch(() => null);
      smp = s;
      if (l && l.images) ui.img = l.images;
      if (!ui.build.busy && !ui.chat.busy && (ui.view === 'import' || ui.view === 'study' || ui.view === 'newdeck')) render();
    } catch (x) {}
  })();
})();
</script>

  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
